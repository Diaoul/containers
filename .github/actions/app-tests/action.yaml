---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: App Tests
description: Takes an app and image then runs tests

inputs:
  app:
    description: App Name
    required: true
  image:
    description: Image
    required: true

runs:
  using: composite
  steps:
    - name: Run Tests
      shell: bash
      env:
        APP: ${{ inputs.app }}
        TEST_IMAGE: ${{ inputs.image }}
      run: |
        ./apps/${APP}/test.sh "${TEST_IMAGE}"
