---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build

on:
  push:
    branches:
      - main
    paths:
      - apps/**
  pull_request:
    paths:
      - apps/**
  workflow_dispatch:
    inputs:
      app:
        description: App to build and release
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changed:
    name: Changed apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: List changed apps
        id: apps
        env:
          EVENT: ${{ github.event_name }}
          INPUT_APP: ${{ inputs.app }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [[ "$EVENT" == workflow_dispatch ]]; then
            apps=$(jq --null-input --compact-output --arg app "$INPUT_APP" '[$app]')
          elif [[ "$BASE" =~ ^0+$ ]]; then
            apps=$(find apps -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | jq --raw-input --slurp --compact-output 'split("\n") | map(select(. != ""))')
          else
            apps=$(git diff --name-only "$BASE" "$HEAD" -- apps | cut -d/ -f2 | sort -u \
              | while read -r app; do [[ -f "apps/$app/Dockerfile" ]] && echo "$app"; done \
              | jq --raw-input --slurp --compact-output 'split("\n") | map(select(. != ""))')
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.app }}
    needs: changed
    if: ${{ needs.changed.outputs.apps != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changed.outputs.apps) }}
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      APP: ${{ matrix.app }}
      RELEASE: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name and version
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          version=$(sed -nE 's/^FROM [^:]+:([^@ ]+).*/\1/p' "apps/$APP/Dockerfile" | tail -n 1)
          [[ -n "$version" ]] || { echo "no version in apps/$APP/Dockerfile" >&2; exit 1; }
          echo "image=ghcr.io/${OWNER,,}/$APP" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.image }}:test
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

      - name: Test
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:test
        run: |
          [[ ! -x "apps/$APP/test.sh" ]] || "apps/$APP/test.sh" "$IMAGE"

      - name: Login to GitHub Container Registry
        if: ${{ env.RELEASE == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push
        if: ${{ env.RELEASE == 'true' }}
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.app }}

      - name: Attest
        if: ${{ env.RELEASE == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
